<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="size" content="720x422">
  <link rel="stylesheet" href="guide.css">
  <link rel="stylesheet" href="usage.css">
</head>
<body>
  <div class="usage">
    <div class="legend-col">
      <h1>찾기 탭</h1>
      <ol class="legend">
        <li><span class="badge">1</span><div><b>제목에 들어간 단어</b><p>띄어쓰기는 무시해요. 숫자만 넣으면(15, 15화) 그 화가 맨 앞에 나와요.</p></div></li>
        <li><span class="badge">2</span><div><b>누르면 그 화로 이동</b><p>엔터를 누르면 첫 번째 결과로 가요.</p></div></li>
        <li><span class="badge">3</span><div><b>◀ 지금</b><p>지금 보고 있는 화예요.</p></div></li>
        <li><span class="badge">4</span><div><b>목록 새로 받기</b><p>목록은 12시간 동안 저장돼요. 새 화가 올라왔으면 눌러 주세요.</p></div></li>
      </ol>
    </div>

    <div class="shot">
      <div class="browser">
        <div class="toolbar">
          <div class="omnibox"><b>youtube.com</b>/watch?v=…&amp;list=…</div>
          <span class="tool-icon active hl"><img src="../../icons/icon32.png" alt=""></span>
          <span class="avatar"></span>
        </div>
      </div>
      <iframe src="popup-demo.html?scene=search" title=""></iframe>
    </div>
  </div>
  <script src="usage.js"></script>
</body>
</html>
