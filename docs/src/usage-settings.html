<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="size" content="720x542">
  <link rel="stylesheet" href="guide.css">
  <link rel="stylesheet" href="usage.css">
</head>
<body>
  <div class="usage">
    <div class="legend-col">
      <h1>설정 탭</h1>
      <ol class="legend">
        <li><span class="badge">1</span><div><b>엔딩을 건너뛸까요?</b><p>YES / NO 로 켜고 꺼요.</p></div></li>
        <li><span class="badge">2</span><div><b>몇 초에 다음 화로 갈까요?</b><p>본편이 끝나는 시간이에요. ◀ ▶ 로 1초씩 바꿀 수 있어요.</p></div></li>
        <li><span class="badge">3</span><div><b>지금 보는 재생목록 추가</b><p>재생목록 영상을 보면서 팝업을 열면 나타나요. 누르면 그 재생목록부터 엔딩을 건너뛰어요.</p></div></li>
      </ol>
      <p class="note">재생목록이 비어 있으면 아무 영상도 건너뛰지 않아요.<br>재생목록 주소를 칸에 직접 붙여 넣어도 돼요.</p>
    </div>

    <div class="shot">
      <div class="browser">
        <div class="toolbar">
          <div class="omnibox"><b>youtube.com</b>/watch?v=…&amp;list=…</div>
          <span class="tool-icon active hl"><img src="../../icons/icon32.png" alt=""></span>
          <span class="avatar"></span>
        </div>
      </div>
      <iframe src="popup-demo.html?scene=settings" title=""></iframe>
    </div>
  </div>
  <script src="usage.js"></script>
</body>
</html>
