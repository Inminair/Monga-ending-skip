<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="size" content="720x312">
  <link rel="stylesheet" href="guide.css">
  <style>
    .row { display: flex; align-items: flex-start; gap: 22px; }
    .row > .browser { width: 430px; }
    .viewport { height: 214px; padding: 16px; border-radius: 0 0 10px 10px; background: #f8f9fa; }
    .video { width: 220px; height: 124px; border-radius: 8px; background: #3c4043; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; }

    .menu-panel {
      position: absolute; right: 8px; top: 48px; width: 260px; padding: 12px 0;
      border-radius: 8px; background: #fff; box-shadow: 0 4px 16px rgba(60,64,67,.3);
    }
    .menu-panel h2 { margin: 0 16px 8px; font-size: 14px; font-weight: 400; }
    .menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #f1f3f4; }
    .menu-item img { width: 16px; height: 16px; image-rendering: pixelated; }
    .menu-item .name { flex: 1; }
    .menu-item svg { width: 18px; height: 18px; fill: var(--chrome-sub); }
    .menu-item .more { color: var(--chrome-sub); }

    .hl { outline: 3px solid var(--pink-deep); outline-offset: 1px; border-radius: 50%; }

    .after { flex: 1; padding-top: 70px; }
    .after .arrow { margin-bottom: 10px; color: var(--pink-deep); font-size: 18px; letter-spacing: -3px; }
    .mini { width: 196px; padding: 0 8px; border-radius: 10px; }
    .mini .toolbar { border-radius: 10px; border-bottom: 0; justify-content: flex-end; }
    .after p { margin: 12px 0 0; }
  </style>
</head>
<body>
  <div class="row">
    <div class="browser">
      <div class="toolbar">
        <span class="nav">←→↻</span>
        <div class="omnibox"><b>youtube.com</b>/watch?v=…&amp;list=…</div>
        <span class="tool-icon active hl">
          <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg>
        </span>
        <span class="avatar"></span>
      </div>
      <div class="viewport"><div class="video">▶</div></div>

      <div class="menu-panel">
        <h2>확장 프로그램</h2>
        <div class="menu-item">
          <img src="../../icons/icon32.png" alt="">
          <span class="name">먼가... 엔딩 스킵</span>
          <span class="tool-icon hl" style="width:26px;height:26px">
            <svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
          </span>
          <span class="more">⋮</span>
        </div>
      </div>

      <div class="bubble" style="right: -6px; top: -14px;"><span class="badge">1</span>퍼즐 아이콘</div>
      <div class="bubble" style="right: 0; top: 142px;"><span class="badge">2</span>고정(📌) 누르기</div>
    </div>

    <div class="after">
      <div class="arrow">▶▶▶</div>
      <div class="browser mini">
        <div class="toolbar">
          <span class="tool-icon hl"><img src="../../icons/icon32.png" alt=""></span>
          <span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg></span>
          <span class="avatar"></span>
        </div>
      </div>
      <p><span class="badge">3</span> 툴바에 아이콘이 생겨요.<br>누르면 설정 · 찾기 창이 열려요.</p>
    </div>
  </div>
</body>
</html>
