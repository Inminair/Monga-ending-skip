<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="fonts/galmuri.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <span class="deco deco-a" aria-hidden="true">✦</span>
  <span class="deco deco-b" aria-hidden="true">✧</span>
  <span class="deco deco-c" aria-hidden="true">✦</span>

  <main class="window">
    <header class="titlebar">
      <span class="title">♥ 먼가... 엔딩 스킵</span>
      <span class="ctrl ctrl-min" aria-hidden="true"></span>
      <span class="ctrl ctrl-max" aria-hidden="true"></span>
      <button class="ctrl ctrl-close" id="close" title="닫기">×</button>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-settings" role="tab" aria-selected="true" aria-controls="panel-settings">설정</button>
      <button class="tab" id="tab-search" role="tab" aria-selected="false" aria-controls="panel-search">찾기</button>
    </nav>

    <section class="body" id="panel-settings" role="tabpanel">
      <div class="field">
        <div class="label">▸ 엔딩을 건너뛸까요?</div>
        <div class="choice">
          <button class="px-btn yes" id="yes">YES</button>
          <button class="px-btn no" id="no">NO</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="skipAt">▸ 몇 초에 다음 화로 갈까요?</label>
        <div class="stepper">
          <button class="px-btn arrow" id="minus" title="1초 줄이기">◀</button>
          <input type="number" id="skipAt" min="1" step="1">
          <button class="px-btn arrow" id="plus" title="1초 늘리기">▶</button>
          <span class="unit">초</span>
        </div>
      </div>

      <div class="field">
        <label class="label" for="playlists">▸ 재생목록 ID 또는 주소</label>
        <textarea id="playlists" spellcheck="false"></textarea>
        <p class="hint">여러 개는 줄바꿈으로 구분해요.<br>비우면 3분 이하 모든 영상에 적용돼요.</p>
      </div>
    </section>

    <section class="body" id="panel-search" role="tabpanel" hidden>
      <label class="label" for="query">▸ 제목으로 찾아가기</label>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 9 9" aria-hidden="true" shape-rendering="crispEdges">
          <path d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2zM6 6h1v1H6zM7 7h1v1H7zM8 8h1v1H8z"/>
        </svg>
        <input type="text" id="query" placeholder="예) 푸딩, 15화" autocomplete="off" spellcheck="false">
      </div>

      <div class="source">
        <span id="source">♪ 목록 준비 중</span>
        <button class="px-btn mini" id="refresh" title="목록 새로 받기">↻</button>
      </div>

      <div class="loading" id="loading" hidden>
        <span>LOADING</span>
        <div class="bar"><i></i></div>
      </div>
      <p class="note" id="note"></p>
      <ol class="results" id="results"></ol>
    </section>

    <footer class="statusbar">
      <span id="status">♡ 대기 중</span>
      <span class="chevrons" aria-hidden="true">▶▶▶</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
